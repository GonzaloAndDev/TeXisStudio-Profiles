schema_version: "1.0.0"
id: ar_uba_apa7
name: "UBA - Tesis (APA 7)"
status: reviewed
latex_engine: xelatex
compiler: latexmk
bibliography_backend: biber
bibliography_style: apa

# ── Verificación contra guías oficiales ──────────────────────────
# Revisado el 2026-05-25 contra lineamientos del Rectorado de la UBA
# y disposiciones de la Comisión de Doctorado de las Facultades.
verification:
  reviewed_at: "2026-05-25"
  reviewed_by: "TeXisStudio Community"
  verified_at: "2026-05-25"
  verified_by: "TeXisStudio Community — reviewed against UBA Rectorate guidelines and Doctoral Commission regulations"
  source_urls:
    - "https://www.uba.ar/posgrado/"
    - "https://www.uba.ar/download/academicos/doctorales/reglamento.pdf"
  review_interval_days: 365

# ── Formato de página ─────────────────────────────────────────────
# UBA: A4, márgenes estándar LATAM (izq 3cm, resto 2.5cm).
# Interlineado: 1.5. Fuente: Times New Roman 12pt.
# El formato varía por Facultad — verifica con tu unidad académica.
document_class:
  name: book
  options:
    - 12pt
    - a4paper
    - oneside

page_layout:
  paper: a4paper
  margins:
    top: 25mm
    bottom: 25mm
    left: 30mm
    right: 25mm
  line_spacing: 1.5

max_abstract_words: 350

packages: []

sections:
  - id: portada
    element_id: cover
    placement: front_matter
    required: true
    title: "Title Page"
    guidance: |
      The official UBA title page must include:
      • Logo and name of the Universidad de Buenos Aires.
      • Name of the Faculty (FCE, FFyL, FMED, etc.).
      • Name of the doctoral program.
      • Full title of the thesis.
      • "Thesis submitted to obtain the degree of Doctor/a in [field]."
      • Full name of the author.
      • Thesis supervisor and co-supervisor (if applicable).
      • Buenos Aires, [Month] [Year].
      Each faculty has its own specific title page format —
      download it from the Secretaría de Posgrado of your academic unit.

  - id: declaracion
    element_id: declaration
    placement: front_matter
    required: true
    title: "Sworn Authorship Statement"
    guidance: |
      UBA requires a Sworn Statement of Authorship and Originality.
      The Rectorate or Faculty may require a specific signed form.
      Standard text: "The undersigned declares under oath that this thesis
      is their own work, that it has not previously been submitted to obtain
      any degree at any institution, and that all sources consulted have been
      correctly cited."

  - id: resumen
    element_id: abstract
    placement: front_matter
    required: true
    title: "Abstract"
    guidance: |
      Abstract in Spanish, 200–350 words.
      Problem, objectives, methodology, results and conclusions.
      Keywords (4–6).

  - id: abstract_ingles
    element_id: abstract_en
    placement: front_matter
    required: false
    title: "Abstract"
    guidance: |
      Abstract in English. Recommended for international visibility.
      Maximum 350 words. Keywords (4–6).

  - id: agradecimientos
    element_id: acknowledgements
    placement: front_matter
    required: false
    title: "Acknowledgements"
    guidance: |
      Acknowledge the supervisor, evaluation committee, CONICET and ANPCyT
      (PICT) grants, UBACyT (UBA Institutional Recognition Programs),
      MINCYT and other funding sources. Include the project or scholarship number.

  - id: indice
    element_id: toc
    placement: front_matter
    required: true
    title: "Table of Contents"
    guidance: "Generated automatically. Exact page numbers."

  - id: indice_figuras
    element_id: list_of_figures
    placement: front_matter
    required: false
    title: "List of Figures"
    guidance: "Enable if you have 5 or more figures."

  - id: indice_tablas
    element_id: list_of_tables
    placement: front_matter
    required: false
    title: "List of Tables"
    guidance: "Enable if you have 5 or more tables."

  - id: introduccion
    element_id: introduction
    placement: body
    required: true
    title: "Introduction"
    label: "capitulo:introduccion"
    guidance: |
      Contextualization, problem statement, rationale,
      research questions, objectives and hypotheses. Structure.
      APA 7: (Author, year) in the text.

  - id: marco_teorico
    element_id: literature_review
    placement: body
    required: true
    title: "Theoretical Framework"
    label: "capitulo:marcoteorico"
    guidance: |
      Critical review and conceptual foundations.
      Organize by theoretical approaches. Identify the gap the thesis addresses.

  - id: metodologia
    element_id: methodology
    placement: body
    required: true
    title: "Methodology"
    label: "capitulo:metodologia"
    guidance: |
      Research design, sample, instruments, procedure, analysis.
      Institutional Ethics Committee approval if human subjects are involved.

  - id: resultados
    element_id: results
    placement: body
    required: true
    title: "Results"
    label: "capitulo:resultados"
    guidance: "Objective findings. APA 7 tables and figures. No interpretation."

  - id: discusion
    element_id: discussion
    placement: body
    required: false
    title: "Discussion"
    label: "capitulo:discusion"
    guidance: "Interpretation, comparison with literature, implications and limitations."

  - id: conclusiones
    element_id: conclusions
    placement: body
    required: true
    title: "Conclusions"
    label: "capitulo:conclusiones"
    guidance: "Address objectives, summarize contributions, limitations and future work."

  - id: referencias
    element_id: bibliography
    placement: back_matter
    required: true
    title: "References"
    guidance: "APA 7th edition, alphabetical list, hanging indent."

  - id: apendices
    element_id: appendix
    placement: back_matter
    required: false
    title: "Appendices"
    guidance: "Instruments, additional data, ethics approval. Appendix A, B…"