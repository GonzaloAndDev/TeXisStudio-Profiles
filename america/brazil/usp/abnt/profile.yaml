schema_version: 1.0.0
id: br_usp_abnt
name: br_usp_abnt
status: experimental
latex_engine: xelatex
compiler: latexmk
document_class:
  name: book
  options:
  - 12pt
  - a4paper
  - oneside
bibliography_backend: biber
bibliography_style: abnt
page_layout:
  paper: a4paper
  margins:
    top: 30mm
    bottom: 20mm
    left: 30mm
    right: 20mm
  line_spacing: 1.5
packages: []
sections:
- id: capa
  element_id: cover
  placement: front_matter
  required: true
- id: folha_rosto
  element_id: title_page
  placement: front_matter
  required: true
- id: resumo
  element_id: abstract
  placement: front_matter
  required: true
- id: abstract
  element_id: abstract_en
  placement: front_matter
  required: true
- id: sumario
  element_id: toc
  placement: front_matter
  required: true
- id: introducao
  element_id: chapter
  placement: body
  required: true
- id: capitulos
  element_id: chapter
  placement: body
  required: true
- id: conclusao
  element_id: chapter
  placement: body
  required: true
- id: referencias
  element_id: bibliography
  placement: back_matter
  required: true
