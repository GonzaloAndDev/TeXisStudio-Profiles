schema_version: "1.0.0"
id: cl_uchile_apa7
name: "U. de Chile - Tesis (APA 7)"
status: reviewed
latex_engine: xelatex
compiler: latexmk
bibliography_backend: biber
bibliography_style: apa

# ── Verificación contra guías oficiales ──────────────────────────
# Revisado el 2026-05-25 contra los Reglamentos de Postgrado de la
# Universidad de Chile y las directrices de la VID (Vicerrectoría de
# Investigación y Desarrollo).
verification:
  reviewed_at: "2026-05-25"
  reviewed_by: "TeXisStudio Community"
  verified_at: "2026-05-25"
  verified_by: "TeXisStudio Community — reviewed against Universidad de Chile Graduate Regulations and VID guidelines"
  source_urls:
    - "https://www.uchile.cl/postgrado"
    - "https://www.vid.uchile.cl/"
  review_interval_days: 365

# ── Formato de página ─────────────────────────────────────────────
# Universidad de Chile: A4, márgenes estándar LATAM.
# Interlineado: 1.5. Fuente: Times New Roman 12pt.
document_class:
  name: book
  options:
    - 12pt
    - a4paper
    - oneside

page_layout:
  paper: a4paper
  margins:
    top: 25mm
    bottom: 25mm
    left: 30mm
    right: 25mm
  line_spacing: 1.5

max_abstract_words: 350

packages: []

sections:
  - id: portada
    element_id: cover
    placement: front_matter
    required: true
    title: "Title Page"
    guidance: |
      The official U. de Chile title page must include:
      • Logo and name of the Universidad de Chile.
      • Faculty and Institute or Department.
      • Full thesis title.
      • "THESIS to obtain the degree of Doctor in [field]."
      • Author’s name.
      • Thesis supervisor (guía) and co-supervisor (if applicable).
      • Santiago, Chile, [Month] [Year].
      Verify the format with the Doctoral Coordination of your Faculty.

  - id: declaracion
    element_id: declaration
    placement: front_matter
    required: true
    title: "Authorship Declaration"
    guidance: |
      Originality declaration required by U. de Chile.
      The Graduate Unit may require a signed record by the Academic Committee.

  - id: resumen
    element_id: abstract
    placement: front_matter
    required: true
    title: "Abstract"
    guidance: |
      Abstract in Spanish, 200–350 words.
      Problem, objectives, methodology, results and conclusions.
      Keywords (4–6).

  - id: abstract_ingles
    element_id: abstract_en
    placement: front_matter
    required: false
    title: "Abstract"
    guidance: "Abstract in English. Recommended. Maximum 350 words. Keywords (4–6)."

  - id: agradecimientos
    element_id: acknowledgements
    placement: front_matter
    required: false
    title: "Acknowledgements"
    guidance: |
      Acknowledge the thesis supervisor, Academic Committee, ANID grants
      (ex-CONICYT: FONDECYT, FONDEF, Becas Chile) — include project or scholarship number.
      Also include UCH funds such as VID-FONDAP or Vicerrectoría projects.

  - id: dedicatoria
    element_id: dedication
    placement: front_matter
    required: false
    title: "Dedication"
    guidance: "Optional. One to three lines. No printed heading."

  - id: indice
    element_id: toc
    placement: front_matter
    required: true
    title: "Table of Contents"
    guidance: "Generated automatically. Exact page numbers."

  - id: indice_figuras
    element_id: list_of_figures
    placement: front_matter
    required: false
    title: "List of Figures"
    guidance: "Enable if you have 5 or more figures."

  - id: indice_tablas
    element_id: list_of_tables
    placement: front_matter
    required: false
    title: "List of Tables"
    guidance: "Enable if you have 5 or more tables."

  - id: introduccion
    element_id: introduction
    placement: body
    required: true
    title: "Introduction"
    label: "capitulo:introduccion"
    guidance: |
      Contextualization, problem statement, rationale,
      research questions, objectives, hypotheses and structure.
      APA 7: (Author, year) in the text.

  - id: marco_teorico
    element_id: literature_review
    placement: body
    required: true
    title: "Theoretical Framework"
    label: "capitulo:marcoteorico"
    guidance: "Critical review organized by topics. Identify the gap the thesis addresses."

  - id: metodologia
    element_id: methodology
    placement: body
    required: true
    title: "Methodology"
    label: "capitulo:metodologia"
    guidance: |
      Research design, sample, instruments, procedure, analysis.
      Approval from the Research Ethics Committee on Human Beings (CEISH)
      if applicable.

  - id: resultados
    element_id: results
    placement: body
    required: true
    title: "Results"
    label: "capitulo:resultados"
    guidance: "Objective findings. APA 7 tables and figures."

  - id: discusion
    element_id: discussion
    placement: body
    required: false
    title: "Discussion"
    label: "capitulo:discusion"
    guidance: "Interpretation, comparison with literature, implications and limitations."

  - id: conclusiones
    element_id: conclusions
    placement: body
    required: true
    title: "Conclusions"
    label: "capitulo:conclusiones"
    guidance: "Address objectives, contributions, limitations and future work."

  - id: referencias
    element_id: bibliography
    placement: back_matter
    required: true
    title: "References"
    guidance: "APA 7th edition, alphabetical list, hanging indent."

  - id: apendices
    element_id: appendix
    placement: back_matter
    required: false
    title: "Appendices"
    guidance: "Instruments, additional data, ethics approval. Appendix A, B…"