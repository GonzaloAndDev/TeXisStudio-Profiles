schema_version: "1.0.0"
id: mx_uanl_apa7
name: "UANL - Tesis (APA 7)"
status: reviewed
latex_engine: xelatex
compiler: latexmk
bibliography_backend: biber
bibliography_style: apa

# ── Verificación contra guías oficiales ──────────────────────────
# Revisado el 2026-05-25 contra lineamientos de la Dirección de Estudios
# de Posgrado de la Universidad Autónoma de Nuevo León.
verification:
  reviewed_at: "2026-05-25"
  reviewed_by: "TeXisStudio Community"
  verified_at: "2026-05-25"
  verified_by: "TeXisStudio Community — reviewed against UANL Graduate Studies Office guidelines"
  source_urls:
    - "https://www.uanl.mx/posgrado/"
    - "https://www.uanl.mx/tramites/titulacion/"
  review_interval_days: 365

document_class:
  name: book
  options:
    - 12pt
    - letterpaper
    - oneside

page_layout:
  paper: letterpaper
  margins:
    top: 25mm
    bottom: 25mm
    left: 30mm
    right: 20mm
  line_spacing: 1.5

max_abstract_words: 350

packages: []

sections:
  - id: portada
    element_id: cover
    placement: front_matter
    required: true
    title: "Title Page"
    guidance: |
      Official UANL title page. Includes:
      • UANL shield and name.
      • Name of the Faculty or Graduate Division.
      • Thesis title.
      • "THESIS for the degree of [Master/Doctor] in [Program]."
      • Author’s name.
      • Thesis director.
      • San Nicolás de los Garza, N.L., [Month] [Year].
      Verify the specific title page format with the Graduate Office of your Faculty.

  - id: declaracion
    element_id: declaration
    placement: front_matter
    required: true
    title: "Authenticity Declaration"
    guidance: |
      Originality declaration required by UANL.
      Some faculties require an additional letter signed by the director.

  - id: resumen
    element_id: abstract
    placement: front_matter
    required: true
    title: "Abstract"
    guidance: |
      Abstract in Spanish, 200–350 words.
      Problem, objective, method, results and main conclusion.
      Keywords (4–6).

  - id: abstract_ingles
    element_id: abstract_en
    placement: front_matter
    required: false
    title: "Abstract"
    guidance: "Abstract in English. Recommended. Maximum 350 words. Keywords (4–6)."

  - id: agradecimientos
    element_id: acknowledgements
    placement: front_matter
    required: false
    title: "Acknowledgements"
    guidance: |
      Acknowledge the thesis director, committee members, CONAHCYT grants and
      PAICYT projects (UANL Scientific and Technological Research Support Program).

  - id: indice
    element_id: toc
    placement: front_matter
    required: true
    title: "Table of Contents"
    guidance: "Generated automatically. Exact page numbers."

  - id: indice_figuras
    element_id: list_of_figures
    placement: front_matter
    required: false
    title: "List of Figures"
    guidance: "Enable if you have 5 or more figures."

  - id: indice_tablas
    element_id: list_of_tables
    placement: front_matter
    required: false
    title: "List of Tables"
    guidance: "Enable if you have 5 or more tables."

  - id: introduccion
    element_id: introduction
    placement: body
    required: true
    title: "Introduction"
    label: "capitulo:introduccion"
    guidance: |
      Contextualization, problem statement, rationale,
      research questions, objectives and hypotheses. Thesis structure.

  - id: marco_teorico
    element_id: literature_review
    placement: body
    required: true
    title: "Theoretical Framework"
    label: "capitulo:marcoteorico"
    guidance: |
      Critical review of the literature and conceptual foundations.
      Organize by topics. Identify the gap. APA 7: (Author, year).

  - id: metodologia
    element_id: methodology
    placement: body
    required: true
    title: "Methodology"
    label: "capitulo:metodologia"
    guidance: "Design, sample, instruments, procedure, analysis and ethics."

  - id: resultados
    element_id: results
    placement: body
    required: true
    title: "Results"
    label: "capitulo:resultados"
    guidance: "Objective findings. APA 7 tables and figures. No interpretation."

  - id: discusion
    element_id: discussion
    placement: body
    required: false
    title: "Discussion"
    label: "capitulo:discusion"
    guidance: "Interpretation, comparison with literature, implications and limitations."

  - id: conclusiones
    element_id: conclusions
    placement: body
    required: true
    title: "Conclusions"
    label: "capitulo:conclusiones"
    guidance: "Answer questions, summarize contributions, limitations and future work."

  - id: referencias
    element_id: bibliography
    placement: back_matter
    required: true
    title: "References"
    guidance: "APA 7th edition, alphabetical list, hanging indent."

  - id: apendices
    element_id: appendix
    placement: back_matter
    required: false
    title: "Appendices"
    guidance: "Supplementary materials. Label Appendix A, B…"