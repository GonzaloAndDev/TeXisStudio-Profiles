schema_version: 1.0.0
id: us_mit_ieee
name: us_mit_ieee
status: verified
latex_engine: xelatex
compiler: latexmk
bibliography_backend: biber
bibliography_style: ieee
verification:
  reviewed_at: '2026-05-25'
  reviewed_by: TeXisStudio Community — revisado contra MIT Thesis Preparation Guide
  verified_at: '2026-05-27'
  verified_by: TeXisStudio CI — automated LaTeX compilation + postflight (xelatex + biber + pdfinfo/pdffonts)
  ci_evidence: https://github.com/GonzaloAndDev/TeXisStudio-Profiles/actions/runs/26521375446
  source_urls:
  - https://libraries.mit.edu/distinctive-collections/thesis-specs/
  - https://libguides.mit.edu/cite-write/thesis
  review_interval_days: 365
document_class:
  name: book
  options:
  - 12pt
  - letterpaper
  - oneside
page_layout:
  paper: letterpaper
  margins:
    top: 25.4mm
    bottom: 25.4mm
    left: 38.1mm
    right: 25.4mm
  line_spacing: 2.0
max_abstract_words: 350
packages:
- siunitx
- pgfplots
- circuitikz
- cancel
- xfrac
title_page_template:
  template: "\\thispagestyle{empty}\n\\begin{titlepage}\n  \\centering\n  \\vspace*{2cm}\n  {\\large {{ institution_name | latex_escape }}\\par}\n  {% if faculty is defined and faculty %}\n  \\vspace{0.4cm}\n  {\\normalsize {{ faculty | latex_escape }}\\par}\n  {% endif %}\n  \\vspace{2.5cm}\n  {\\huge\\bfseries {{ title | latex_escape }}\\par}\n  \\vspace{3cm}\n  {\\large {{ doc_kind_label }}\\par}\n  \\vspace{0.4cm}\n  {\\normalsize by\\par}\n  \\vspace{0.4cm}\n  {\\large\\bfseries {{ author | latex_escape }}\\par}\n  {% if advisors %}\n  \\vspace{2cm}\n  {\\normalsize Thesis Supervisor{% if advisors|length > 1 %}s{% endif %}:\\par}\n  \\vspace{0.3cm}\n  {% for a in advisors %}\n  {\\normalsize {{ a | latex_escape }}\\par}\n  {% endfor %}\n  {% endif %}\n  \\vfill\n  {\\normalsize {{ city | latex_escape }}\\par}\n  {\\normalsize {{ year }}\\par}\n\\end{titlepage}\n"
sections:
- id: title_page
  element_id: cover
  placement: front_matter
  required: true
- id: abstract
  element_id: abstract_en
  placement: front_matter
  required: true
- id: acknowledgements
  element_id: acknowledgements
  placement: front_matter
  required: false
- id: table_of_contents
  element_id: toc
  placement: front_matter
  required: true
- id: list_of_figures
  element_id: list_of_figures
  placement: front_matter
  required: false
- id: list_of_tables
  element_id: list_of_tables
  placement: front_matter
  required: false
- id: introduction
  element_id: introduction
  placement: body
  required: true
  label: chapter:introduction
- id: background
  element_id: theoretical_framework
  placement: body
  required: true
  label: chapter:background
- id: methodology
  element_id: methodology
  placement: body
  required: true
  label: chapter:methodology
- id: experiments
  element_id: experimentation
  placement: body
  required: true
  label: chapter:experiments
- id: discussion
  element_id: discussion
  placement: body
  required: false
  label: chapter:discussion
- id: conclusion
  element_id: conclusions
  placement: body
  required: true
  label: chapter:conclusion
- id: references
  element_id: bibliography
  placement: back_matter
  required: true
- id: appendices
  element_id: appendix
  placement: back_matter
  required: false
