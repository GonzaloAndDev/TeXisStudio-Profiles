schema_version: 1.0.0
id: jp_kyoto_apa7
name: jp_kyoto_apa7
status: experimental
latex_engine: xelatex
compiler: latexmk
document_class:
  name: book
  options:
  - 12pt
  - a4paper
  - oneside
bibliography_backend: biber
bibliography_style: apa
page_layout:
  paper: a4paper
  margins:
    top: 25mm
    bottom: 25mm
    left: 35mm
    right: 25mm
  line_spacing: 1.5
packages: []
sections:
- id: title_page
  element_id: cover
  placement: front_matter
  required: true
- id: abstract
  element_id: abstract
  placement: front_matter
  required: true
- id: acknowledgements
  element_id: acknowledgements
  placement: front_matter
  required: false
- id: table_of_contents
  element_id: toc
  placement: front_matter
  required: true
- id: introduction
  element_id: chapter
  placement: body
  required: true
- id: literature_review
  element_id: chapter
  placement: body
  required: true
- id: methodology
  element_id: chapter
  placement: body
  required: true
- id: results
  element_id: chapter
  placement: body
  required: true
- id: discussion
  element_id: chapter
  placement: body
  required: true
- id: conclusion
  element_id: chapter
  placement: body
  required: true
- id: references
  element_id: bibliography
  placement: back_matter
  required: true
- id: appendices
  element_id: appendix
  placement: back_matter
  required: false
