schema_version: 1.0.0
id: uk_cambridge_apa7
name: uk_cambridge_apa7
status: verified
latex_engine: xelatex
compiler: latexmk
bibliography_backend: biber
bibliography_style: apa
verification:
  reviewed_at: '2026-05-24'
  reviewed_by: TeXisStudio Community
  verified_at: '2026-05-28'
  verified_by: TeXisStudio CI — automated LaTeX compilation + postflight (xelatex + biber)
  ci_evidence: https://github.com/GonzaloAndDev/TeXisStudio-Profiles/actions/runs/26552369667
  source_urls:
  - https://www.cambridgestudents.cam.ac.uk/your-course/graduate-study/write-your-thesis/format-your-thesis
  - https://www.cambridgestudents.cam.ac.uk/your-course/graduate-study/write-your-thesis
  - https://www.cambridgestudents.cam.ac.uk/your-course/graduate-study/write-your-thesis/thesis-submission
  review_interval_days: 365
document_class:
  name: book
  options:
  - 12pt
  - a4paper
  - oneside
page_layout:
  paper: a4paper
  margins:
    top: 25mm
    bottom: 25mm
    left: 40mm
    right: 25mm
  line_spacing: 2.0
max_words: 80000
max_abstract_words: 300
packages: []
title_page_template:
  template: "\\thispagestyle{empty}\n\\begin{titlepage}\n  \\centering\n  \\vspace*{2cm}\n  {\\large\\scshape {{ institution_name | latex_escape }}\\par}\n  {% if faculty is defined and faculty %}\n  \\vspace{0.3cm}\n  {\\normalsize {{ faculty | latex_escape }}\\par}\n  {% endif %}\n  \\vspace{3cm}\n  {\\huge\\bfseries {{ title | latex_escape }}\\par}\n  \\vspace{3cm}\n  {\\normalsize A {{ doc_kind_label }} submitted for the degree of\\par}\n  {\\large\\bfseries {{ degree_label }}\\par}\n  \\vspace{2.5cm}\n  {\\large {{ author | latex_escape }}\\par}\n  {% if advisors %}\n  \\vspace{1cm}\n  {\\normalsize Supervisor{% if advisors|length > 1 %}s{% endif %}:\\par}\n  {% for a in advisors %}\n  {\\normalsize {{ a | latex_escape }}\\par}\n  {% endfor %}\n  {% endif %}\n  \\vfill\n  {\\normalsize {{ institution_name | latex_escape }}\\par}\n  {\\normalsize {{ year }}\\par}\n\\end{titlepage}\n"
sections:
- id: title_page
  element_id: cover
  placement: front_matter
  required: true
- id: declaration
  element_id: chapter
  placement: front_matter
  required: true
- id: abstract
  element_id: abstract_en
  placement: front_matter
  required: true
- id: acknowledgements
  element_id: acknowledgements
  placement: front_matter
  required: false
- id: table_of_contents
  element_id: toc
  placement: front_matter
  required: true
- id: list_of_figures
  element_id: list_of_figures
  placement: front_matter
  required: false
- id: list_of_tables
  element_id: list_of_tables
  placement: front_matter
  required: false
- id: abbreviations
  element_id: acronyms
  placement: front_matter
  required: false
- id: introduction
  element_id: chapter
  placement: body
  required: true
  label: ch:introduction
- id: literature_review
  element_id: chapter
  placement: body
  required: true
  label: ch:literature
- id: theoretical_framework
  element_id: chapter
  placement: body
  required: false
  label: ch:theory
- id: methodology
  element_id: chapter
  placement: body
  required: true
  label: ch:methodology
- id: results
  element_id: chapter
  placement: body
  required: true
  label: ch:results
- id: discussion
  element_id: chapter
  placement: body
  required: true
  label: ch:discussion
- id: conclusion
  element_id: chapter
  placement: body
  required: true
  label: ch:conclusion
- id: references
