schema_version: "1.0.0"
id: generic_especialidad
name: "Trabajo de Especialidad Genérico"
status: reviewed
latex_engine: xelatex
compiler: latexmk
bibliography_backend: biber
bibliography_style: apa

verification:
  reviewed_at: "2026-05-28"
  reviewed_by: "TeXisStudio Community"
  source_urls:
    - "https://apastyle.apa.org/instructional-aids/student-paper-setup-guide.pdf"
    - "https://apastyle.apa.org/style-grammar-guidelines/paper-format"
  review_interval_days: 365

document_class:
  name: report
  options:
    - 12pt
    - letterpaper
    - oneside

page_layout:
  paper: letterpaper
  margins:
    top: 25mm
    bottom: 25mm
    left: 30mm
    right: 20mm
  line_spacing: 1.5

max_abstract_words: 300

packages: []

sections:
  - id: portada
    element_id: cover
    placement: front_matter
    required: true
    title: "Title Page"
    guidance: |
      Include institution, specialty program name, work title,
      author, advisor, city and date. If your hospital, professional college
      or program has an official format, use it as the source of truth.

  - id: resumen
    element_id: abstract
    placement: front_matter
    required: true
    title: "Abstract"
    guidance: |
      Summarizes the professional problem addressed, the context, the intervention
      or analysis strategy, the main results and the practical utility of the work.
      Suggested length: 150–300 words.

  - id: indice
    element_id: toc
    placement: front_matter
    required: true
    title: "Table of Contents"
    guidance: |
      Generated automatically. Review the final pagination before submission.

  - id: introduccion
    element_id: introduction
    placement: body
    required: true
    title: "Introduction"
    guidance: |
      Presents the professional or clinical problem, the institutional context,
      the relevance of the work and the document’s objectives.

  - id: marco_referencial
    element_id: literature_review
    placement: body
    required: true
    title: "Reference Framework"
    guidance: |
      Synthesizes the regulations, prior evidence, protocols, clinical guidelines
      or literature that underpin the adopted approach.

  - id: metodologia
    element_id: methodology
    placement: body
    required: true
    title: "Methodology / Intervention"
    guidance: |
      Describes the work design, procedure, selection criteria,
      instruments, applied intervention or strategy, and ethical considerations.

  - id: resultados
    element_id: results
    placement: body
    required: true
    title: "Results"
    guidance: |
      Presents the findings, products, metrics, evaluations or observed results
      of the specialty work.

  - id: discusion
    element_id: discussion
    placement: body
    required: false
    title: "Discussion"
    guidance: |
      Interprets the results, compares them with literature or standards,
      acknowledges limitations and highlights practical implications.

  - id: conclusiones
    element_id: conclusions
    placement: body
    required: true
    title: "Conclusions and Recommendations"
    guidance: |
      Summarizes the professional contribution of the work, its applied utility
      and recommendations for continuity or improvement.

  - id: referencias
    element_id: bibliography
    placement: back_matter
    required: true
    title: "References"
    guidance: |
      Final reference list in APA 7. Include only cited sources.

  - id: anexos
    element_id: appendix
    placement: back_matter
    required: false
    title: "Annexes"
    guidance: |
      Supplementary material: instruments, protocols, forms, extended tables
      or supporting technical documentation.