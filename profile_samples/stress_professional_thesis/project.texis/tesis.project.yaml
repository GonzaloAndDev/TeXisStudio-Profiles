          "content": "En el capitulo 8, la fase de levantamiento de requisitos institucionales se analiza como un componente operativo del flujo academico profesional. El criterio de mantenibilidad se evalua mediante listas de verificacion, evidencia documental y pruebas de compilacion que reducen la ambiguedad entre lo que la institucion solicita y lo que el documento realmente produce. La decision metodologica principal consiste en separar el contenido intelectual del estudiante de las reglas mecanicas de formato, de modo que portada, margenes, bibliografia, anexos y metadatos puedan auditarse sin reescribir el texto central. Esta separacion tambien permite que usuarios de instituciones distintas construyan perfiles propios a partir de ejemplos confiables sin asumir que un perfil generico resuelve todas las obligaciones locales.",
          "verbatim": false
        },
