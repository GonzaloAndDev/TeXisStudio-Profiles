      "title": "Resumen",
      "placement": "front_matter",
      "required": true,
      "enabled": true,
      "label": null,
      "blocks": [
        {
          "type": "paragraph",
          "id": "abs-es-p1",
          "content": "Esta tesis de prueba evalua un flujo profesional para construir, validar y exportar documentos academicos largos con TeXisStudio. El caso de estudio combina perfil institucional, checklist de evidencia, fuentes oficiales, configuracion tipografica, bibliografia, figuras, tablas, ecuaciones, algoritmos, glosario y anexos. La metodologia se disena como una prueba de estres reproducible: cada capitulo introduce bloques heterogeneos y referencias cruzadas, mientras el proyecto conserva compatibilidad con la generacion LaTeX automatica y la exportacion final. Los resultados esperados son un PDF extenso, estable y auditable, junto con archivos fuente suficientes para detectar regresiones en perfiles, plugins visuales y validadores.",
          "verbatim": false
        }
      ],
      "fields": {},
      "children": []
    },
    {
      "id": "abstract_en",
      "element_id": "abstract_en",
      "title": "Abstract",
      "placement": "front_matter",
      "required": false,
      "enabled": true,
      "label": null,
      "blocks": [
        {
          "type": "paragraph",
          "id": "abs-en-p1",
          "content": "This stress thesis evaluates a professional workflow for building, validating, and exporting long academic documents with TeXisStudio. The case study combines institutional profiles, evidence checklists, official sources, typographic configuration, bibliography, figures, tables, equations, algorithms, glossary entries, and appendices. The methodology is reproducible: each chapter introduces heterogeneous blocks and cross references while preserving compatibility with automatic LaTeX generation and final delivery export.",
          "verbatim": false
        }
      ],
      "fields": {},
      "children": []
    },
